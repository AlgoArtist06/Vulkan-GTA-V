[package]
name = "gta5-native-renderer"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
name = "gta5_native_renderer"
path = "src/lib.rs"

[dependencies]
ash = { version = "0.38", default-features = false, features = ["linked", "debug", "std"] }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "spv-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }

[profile.release]
opt-level = 2
debug = 0
strip = "debuginfo"
codegen-units = 1
