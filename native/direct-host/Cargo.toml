[package]
name = "gta5-native-direct-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "gta5_native_direct_host"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
default = []

[dependencies]
gta5-native-renderer = { path = "../vk-renderer" }
gta5-native-platform = { path = "../platform" }
gta5-native-input = { path = "../input" }
anyhow = "1"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[profile.release]
opt-level = 2
debug = 0
strip = "debuginfo"
codegen-units = 1
